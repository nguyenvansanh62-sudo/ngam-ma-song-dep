# Cau hinh trang quan tri "Ngam ma song dep" (Sveltia CMS - tuong thich dinh dang Decap CMS)
# Noi dung sua tai day se luu vao data/du-lieu-noi-dung.json trong kho GitHub,
# sau do co che tu dong xuat ban dua ban moi len Cloudflare Pages.

backend:
  name: github
  repo: nguyenvansanh62-sudo/ngam-ma-song-dep
  branch: main

site_url: https://ngam-ma-song-dep-nguyen-van-sanh.pages.dev
display_url: https://ngam-ma-song-dep-nguyen-van-sanh.pages.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "noi-dung-trang"
    label: "Nội dung trang Web"
    files:
      - name: "du-lieu"
        label: "Toàn bộ nội dung trang"
        file: "data/du-lieu-noi-dung.json"
        fields:
          - label: "Thông tin chung của trang"
            name: "trang"
            widget: "object"
            fields:
              - { label: "Tiêu đề trên tab trình duyệt", name: "tieu_de_tab", widget: "string" }
              - { label: "Tên thương hiệu", name: "ten_thuong_hieu", widget: "string" }
              - { label: "Dòng phụ trên cùng", name: "dong_phu_tren_cung", widget: "string" }
              - { label: "Mô tả trang (cho Google)", name: "mo_ta", widget: "text" }
          - label: "Phần giới thiệu"
            name: "gioi_thieu"
            widget: "object"
            fields:
              - { label: "Lời chào", name: "loi_chao", widget: "string" }
              - { label: "Tên", name: "ten", widget: "string" }
              - { label: "Vai trò", name: "vai_tro", widget: "string" }
              - { label: "Đoạn giới thiệu", name: "doan_gioi_thieu", widget: "text" }
              - { label: "Ảnh chân dung", name: "anh_chan_dung", widget: "image" }
              - { label: "Chú thích ảnh", name: "chu_thich_anh", widget: "string" }
              - label: "Các dòng từ khóa bên cạnh"
                name: "tu_khoa_ben"
                widget: "list"
                field: { label: "Dòng từ khóa", name: "dong", widget: "string" }
          - label: "Câu chuyện thương hiệu"
            name: "cau_chuyen"
            widget: "object"
            fields:
              - { label: "Nhãn mục", name: "nhan_muc", widget: "string" }
              - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
              - { label: "Mô tả", name: "mo_ta", widget: "text" }
              - { label: "Mã video YouTube", name: "video_youtube_id", widget: "string", hint: "Chỉ là mã cuối đường dẫn video, ví dụ pUMDZKMs1xU. Khi đổi video phải đổi khớp cả 3 ô video." }
              - { label: "Đường dẫn nhúng video", name: "video_nhung", widget: "string" }
              - { label: "Đường dẫn xem trên YouTube", name: "video_xem_tren_youtube", widget: "string" }
          - label: "Hình ảnh phong cách"
            name: "hinh_anh"
            widget: "object"
            fields:
              - { label: "Nhãn mục", name: "nhan_muc", widget: "string" }
              - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
              - { label: "Mô tả", name: "mo_ta", widget: "text" }
              - label: "Danh sách ảnh"
                name: "danh_sach"
                widget: "list"
                fields:
                  - { label: "Ảnh", name: "file", widget: "image" }
                  - { label: "Chú thích", name: "chu_thich", widget: "string" }
          - label: "Bốn góc nhìn"
            name: "bon_goc_nhin"
            widget: "list"
            fields:
              - { label: "Số thứ tự", name: "so", widget: "string" }
              - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
              - { label: "Mô tả", name: "mo_ta", widget: "text" }
          - label: "Các chủ đề chia sẻ"
            name: "chu_de"
            widget: "object"
            fields:
              - { label: "Nhãn mục", name: "nhan_muc", widget: "string" }
              - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
              - { label: "Mô tả", name: "mo_ta", widget: "text" }
              - { label: "Câu trích dẫn", name: "cau_trich", widget: "text" }
              - label: "Danh sách chủ đề"
                name: "danh_sach"
                widget: "list"
                fields:
                  - { label: "Mã", name: "ma", widget: "string" }
                  - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
                  - { label: "Mô tả", name: "mo_ta", widget: "text" }
              - label: "Các giá trị"
                name: "gia_tri"
                widget: "list"
                field: { label: "Giá trị", name: "gia_tri", widget: "string" }
          - label: "Cách tiếp cận"
            name: "cach_tiep_can"
            widget: "object"
            fields:
              - { label: "Nhãn mục", name: "nhan_muc", widget: "string" }
              - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
              - { label: "Mô tả", name: "mo_ta", widget: "text" }
              - label: "Các bước"
                name: "cac_buoc"
                widget: "list"
                fields:
                  - { label: "Số thứ tự", name: "so", widget: "string" }
                  - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
                  - { label: "Mô tả", name: "mo_ta", widget: "text" }
          - label: "Thông tin liên hệ"
            name: "lien_he"
            widget: "object"
            fields:
              - { label: "Nhãn mục", name: "nhan_muc", widget: "string" }
              - { label: "Tiêu đề", name: "tieu_de", widget: "string" }
              - { label: "Mô tả", name: "mo_ta", widget: "text" }
              - { label: "Số điện thoại hiển thị", name: "dien_thoai_hien_thi", widget: "string" }
              - { label: "Số điện thoại dạng link", name: "dien_thoai_link", widget: "string", hint: "Dạng tel:+84... — phải khớp số hiển thị." }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Facebook", name: "facebook", widget: "string" }
              - { label: "YouTube – Kênh 1", name: "youtube_kenh_1", widget: "string" }
              - { label: "YouTube – Kênh 2", name: "youtube_kenh_2", widget: "string" }
              - { label: "TikTok", name: "tiktok", widget: "string" }
              - { label: "Link Bio", name: "link_bio", widget: "string" }
          - { label: "Dòng chân trang", name: "chan_trang", widget: "string" }
          - { label: "Ghi chú hệ thống (đừng sửa ô này)", name: "ghi_chu", widget: "text" }
